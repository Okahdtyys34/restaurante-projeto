<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Entrar no painel · Restaurante da Família</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap login-wrap">
    <section class="cart" aria-labelledby="login-title">
      <p class="eyebrow">Restaurante da Família</p>
      <h1 id="login-title">Entrar no painel</h1>
      <p class="cart-note">Acesse a gestão do cardápio com seu usuário e sua senha.</p>
      <!--LOGIN_ERROR-->
      <form method="post" action="/gestao/login" class="login-form">
        <label>Usuário<input name="username" autocomplete="username" maxlength="80" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <button class="button primary full" type="submit">Entrar</button>
      </form>
      <a class="link-button" href="/">Voltar ao cardápio</a>
    </section>
  </main>
</body>
</html>
